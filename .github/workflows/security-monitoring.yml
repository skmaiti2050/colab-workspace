name: Security Monitoring

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    name: Daily Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive security audit
        run: |
          echo "🔍 Running npm audit..."
          npm audit --audit-level=low --json > audit-results.json || true
          
          echo "📊 Full Audit Summary (informational):"
          npm audit --audit-level=low || true

      - name: Check production dependencies for vulnerabilities
        run: |
          echo ""
          echo "🔒 Checking production dependencies..."
          
          # Check production dependencies only
          PROD_AUDIT=$(npm audit --production --json 2>/dev/null || echo '{"metadata":{"vulnerabilities":{"critical":0,"high":0}}}')
          PROD_CRITICAL=$(echo "$PROD_AUDIT" | jq '.metadata.vulnerabilities.critical' || echo "0")
          PROD_HIGH=$(echo "$PROD_AUDIT" | jq '.metadata.vulnerabilities.high' || echo "0")
          
          echo "Production dependencies:"
          echo "  Critical: $PROD_CRITICAL"
          echo "  High: $PROD_HIGH"
          
          if [ "$PROD_CRITICAL" -gt 0 ] || [ "$PROD_HIGH" -gt 0 ]; then
            echo ""
            echo "❌ Found $PROD_HIGH high and $PROD_CRITICAL critical vulnerabilities in production dependencies"
            npm audit --production --audit-level=high
            exit 1
          fi
          
          # Report dev dependencies for awareness (non-blocking)
          echo ""
          echo "📦 Development dependencies (informational only):"
          DEV_AUDIT=$(npm audit --json 2>/dev/null || echo '{"metadata":{"vulnerabilities":{"critical":0,"high":0,"moderate":0}}}')
          DEV_CRITICAL=$(echo "$DEV_AUDIT" | jq '.metadata.vulnerabilities.critical' || echo "0")
          DEV_HIGH=$(echo "$DEV_AUDIT" | jq '.metadata.vulnerabilities.high' || echo "0")
          DEV_MODERATE=$(echo "$DEV_AUDIT" | jq '.metadata.vulnerabilities.moderate' || echo "0")
          
          echo "  Critical: $DEV_CRITICAL"
          echo "  High: $DEV_HIGH"
          echo "  Moderate: $DEV_MODERATE"
          
          if [ "$DEV_HIGH" -gt 0 ] || [ "$DEV_CRITICAL" -gt 0 ]; then
            echo ""
            echo "⚠️  Note: Dev dependencies have known vulnerabilities"
            echo "    Primary issues: minimatch ReDoS (affects eslint/jest/typeorm)"
            echo "    These do not affect production runtime"
            echo "    Tracked for future updates when upstream packages are fixed"
          fi
          
          echo ""
          echo "✅ No high/critical vulnerabilities in production dependencies"

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC